# Static analysis and security checks. Informative: a finding marks its job
# as failed but never blocks a push or a pull request. What blocks is ci.yml.
name: Análise

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=mod
  GOPROXY: "off"
  GOSUMDB: "off"
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  lint:
    name: golangci-lint
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Finais de linha como no repositório
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      # Third-party action: pinned to the commit of v9.3.0.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15
          args: ./cmd/... ./internal/...

  vuln:
    name: govulncheck
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Finais de linha como no repositório
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      # The tool itself comes from the network; the code under analysis still
      # builds offline, from third_party/, with the Go version of the release.
      - name: Instalar o govulncheck
        env:
          GOFLAGS: ""
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: auto
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerabilidades alcançáveis pelo código
        shell: pwsh
        run: |
          & (Join-Path (go env GOPATH) 'bin\govulncheck.exe') ./cmd/... ./internal/...

  race:
    name: go test -race
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1" # the race detector needs cgo
    steps:
      - name: Finais de linha como no repositório
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Testes com o detector de corrida
        run: go test -race ./cmd/axion-rsrc ./internal/...

  segredos:
    name: gitleaks
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the whole history is scanned

      - name: Segredos no histórico
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --config=/repo/.gitleaks.toml --redact --no-banner --verbose /repo
